spring.application.name=Product-ServiceDomain
server.port=9292

#connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/productdomainmodule
spring.datasource.username=root
spring.datasource.password=root

#LSFB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


logging.file.name=C://Users/adity/OneDrive/Desktop/Logging/product.log

logging.level.com.ecommerce.main.controller=info
logging.level.com.ecommerce.main.serviceimpl=info
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] [%thread] %logger{36} - %msg%n

#eureka
eureka.client.service-url.defaultZone=http://localhost:9898/eureka/

#expose endpoints
management.endpoints.web.exposure.include=health,info

#show detailed health
management.endpoints.health.show-details=always