name: Ecommerce CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Product Service
        working-directory: Product-ServiceDomain
        run: mvn clean package -DskipTests

      - name: Build User Service
        working-directory: User-ServiceDomain
        run: mvn clean package -DskipTests

      - name: Build Admin Service
        working-directory: Admin-ServiceDomain
        run: mvn clean package -DskipTests

      - name: Build API Gateway
        working-directory: API-Gateway
        run: mvn clean package -DskipTests

      - name: Build Eureka Registry
        working-directory: Eureka-Registry
        run: mvn clean package -DskipTests

      - name: Build Product Docker Image
        run: docker build -t product-service:latest ./Product-ServiceDomain

      - name: Build User Docker Image
        run: docker build -t user-service:latest ./User-ServiceDomain

      - name: Build Admin Docker Image
        run: docker build -t admin-service:latest ./Admin-ServiceDomain

      - name: Build API Gateway Docker Image
        run: docker build -t api-gateway:latest ./API-Gateway

      - name: Build Eureka Docker Image
        run: docker build -t eureka-registry:latest ./Eureka-Registry